2P';pointer-events:auto;display:none}.toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:#ffe66d;color:#182137;border:4px solid #fff6dc;padding:8px 12px;font-size:21px;opacity:0;transition:.25s}.toast.show{opacity:1}.choice{display:flex;gap:8px;margin-top:12px}.choice button{flex:1;border:3px solid #fff6dc;background:#55d8cc;color:#182137;font:8px 'Press Start 2P';padding:10px 5px}.choice button:last-child{background:#ff78a7}@media(max-width:700px),(pointer:coarse){.controls,.interact{display:grid}.interact{display:block}.quest{bottom:190px}.topbar{left:8px;right:8px}.brand{transform:scale(.85);transform-origin:left top}.chip{font-size:16px;padding:6px}.hud{gap:4px}.dialogue{bottom:16px}.quest p{font-size:18px}.brand span{font-size:18px}}

<body>
<canvas id="game"></canvas>
<div id="ui"><div class="topbar"><div class="brand"><b>PIXELUM</b><span>Chapter 01</span></div><div class="hud"><div class="chip">WAKTU <em id="time">07:30</em></div><div class="chip hearts" id="hearts">♥♥♥</div></div></div><div class="toast" id="toast">Kode baru didapat!</div><div class="quest" id="quest"><h3>MISSION</h3><p id="questText">Temukan Nara di depan kelas</p></div><div class="dialogue" id="dialogue"><div class="portrait" id="portrait"></div><div class="speaker" id="speaker">RAKA</div><div class="text" id="text"></div><div class="choice" id="choice" style="display:none"></div><div class="next" id="next">▼</div></div><div class="controls"><button class="up" data-key="up">▲</button><button class="left" data-key="left">◀</button><button class="down" data-key="down">▼</button><button class="right" data-key="right">▶</button></div><button class="interact" id="interact">AKSI</button><div class="menu" id="menu"><div class="card"><div class="kicker">A SCHOOL PIXEL STORY</div><h1>PIXELUM<br><span>KODE PERTAMA</span></h1><p>SMA Nusantara • 07:30<br>Satu hari biasa yang mungkin jadi tak biasa.</p><button id="start">MULAI SEKOLAH</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true}),addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let started=false,dialog=null,dialogIndex=0,phase=0,hearts=3,codes=0;
const player={x:0,y:125,dir:'down',step:0};
const NPC={nara:{x:-45,y:-25,c:'#4b2b50'},raka:{x:-160,y:10,c:'#17213d'},guru:{x:150,y:-20,c:'#465a75'},teman:{x:115,y:65,c:'#d48857'}};
let world={ox:0,oy:0};
const menu=document.getElementById('menu');document.getElementById('start').onclick=()=>{menu.classList.add('hidden');started=true;showToast('Hari baru, sama seperti kemarin…')};
function iso(x,y){return {x:W/2+x,y:H*.53+y*.58}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function polygon(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function shadow(x,y){ellipse(x+5,y+8,19,7,'#25384b35')}
function drawCloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,0,35,12,'#fff9e8b8');ellipse(-18,1,18,10,'#fff9e8');ellipse(3,-8,20,15,'#fffdf2');ellipse(22,0,20,11,'#fff9e8');ctx.restore()}
function drawTree(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(5,5,27,9,'#354d4930');polygon([[-8,2],[-5,-38],[7,-38],[11,2]],'#91694f');ellipse(-10,-45,22,25,'#4e9a80');ellipse(12,-52,25,29,'#57aa88');ellipse(-2,-66,21,24,'#77bd91');ellipse(-18,-53,8,14,'#94c99b');ellipse(5,-71,7,9,'#a8d7a1');ctx.restore()}
function character(x,y,c,dir='down',isPlayer=false){const p=iso(x,y),s=Math.max(.78,Math.min(1.12,W/900)),nara=c==='#4b2b50',teacher=c==='#465a75',skin=isPlayer?'#efbd9a':nara?'#f4c5a5':'#d99d79',hair=nara?'#39253d':teacher?'#493b50':isPlayer?'#4b3140':'#263149',shirt=isPlayer?'#f2c94c':nara?'#ef86a8':teacher?'#627c9f':c==='#d48857'?'#dd956e':'#334a75';shadow(p.x,p.y);ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);
// tiny contact shadow and shoes
ellipse(3,8,18,6,'#23334840');ctx.fillStyle='#263248';ctx.beginPath();ctx.roundRect(-13,0,10,8,3);ctx.roundRect(4,0,10,8,3);ctx.fill();
// legs and uniform
const leg=ctx.createLinearGradient(0,-9,0,3);leg.addColorStop(0,'#394866');leg.addColorStop(1,'#202b43');ctx.fillStyle=leg;ctx.beginPath();ctx.roundRect(-11,-15,9,19,4);ctx.roundRect(3,-15,9,19,4);ctx.fill();
const torso=ctx.createLinearGradient(-14,-49,14,-12);torso.addColorStop(0,shirt);torso.addColorStop(1,isPlayer?'#d9a83b':nara?'#d96f96':teacher?'#425d81':'#263b64');ctx.fillStyle=torso;ctx.beginPath();ctx.moveTo(-12,-47);ctx.quadraticCurveTo(0,-53,12,-47);ctx.lineTo(16,-17);ctx.quadraticCurveTo(0,-10,-16,-17);ctx.closePath();ctx.fill();
// collar, tie / buttons
ctx.fillStyle='#fff4dc';ctx.beginPath();ctx.moveTo(-6,-47);ctx.lineTo(0,-39);ctx.lineTo(6,-47);ctx.lineTo(2,-32);ctx.lineTo(0,-30);ctx.lineTo(-2,-32);ctx.closePath();ctx.fill();ctx.fillStyle='#db617d';ctx.beginPath();ctx.moveTo(-2,-36);ctx.lineTo(2,-36);ctx.lineTo(4,-25);ctx.lineTo(0,-22);ctx.lineTo(-4,-25);ctx.closePath();ctx.fill();
// arms, sleeves and hands
ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(-20,-45,9,22,5);ctx.roundRect(11,-45,9,22,5);ctx.fill();ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-19,-27,8,9,4);ctx.roundRect(11,-27,8,9,4);ctx.fill();
// neck and head
ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-5,-56,10,12,4);ctx.fill();const face=ctx.createLinearGradient(-14,-83,15,-52);face.addColorStop(0,'#ffddbd');face.addColorStop(1,skin);ctx.fillStyle=face;ctx.beginPath();ctx.ellipse(0,-70,15,19,0,0,Math.PI*2);ctx.fill();
// ears
ctx.fillStyle=skin;ellipse(-14,-69,4,6,skin);ellipse(14,-69,4,6,skin);
// hair cap and styled fringe
ctx.fillStyle=hair;ctx.beginPath();ctx.moveTo(-15,-69);ctx.lineTo(-17,-80);ctx.quadraticCurveTo(-16,-94,0,-94);ctx.quadraticCurveTo(17,-92,17,-79);ctx.lineTo(15,-68);ctx.quadraticCurveTo(9,-75,5,-81);ctx.quadraticCurveTo(1,-72,-5,-73);ctx.quadraticCurveTo(-10,-72,-15,-69);ctx.fill();if(nara){ctx.beginPath();ctx.moveTo(12,-80);ctx.quadraticCurveTo(27,-76,21,-54);ctx.quadraticCurveTo(17,-48,13,-57);ctx.closePath();ctx.fill();}
// face details
ctx.fillStyle='#283047';ellipse(-5,-69,1.8,2.4,'#283047');ellipse(5,-69,1.8,2.4,'#283047');ctx.strokeStyle='#a6585c';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-3,-60);ctx.quadraticCurveTo(0,-58,3,-60);ctx.stroke();ellipse(-9,-63,3,1.5,'#ef9296aa');ellipse(9,-63,3,1.5,'#ef9296aa');
// glossy hair highlight
ctx.strokeStyle='#ffffff25';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-4,-82,8,3.8,5.3);ctx.stroke();ctx.restore()}
function building(){const sx=Math.min(1.05,W/520),cx=W/2,cy=H*.43;ctx.save();ctx.translate(cx,cy);ctx.scale(sx,sx);
// cast shadow, foundation, side volume
ellipse(7,128,265,30,'#263b4933');polygon([[-224,87],[175,87],[227,117],[-174,117]],'#344a56');polygon([[175,-67],[227,-39],[227,92],[175,87]],'#537c78');
const wall=ctx.createLinearGradient(-210,-50,180,90);wall.addColorStop(0,'#72899a');wall.addColorStop(.52,'#586f86');wall.addColorStop(1,'#40586e');polygon([[-225,-73],[175,-73],[175,89],[-225,89]],wall,'#33485e');
// roof slab with visible thickness
polygon([[-244,-83],[176,-83],[226,-54],[-193,-54]],'#f7a16e');polygon([[-244,-83],[176,-83],[176,-70],[-244,-70]],'#ffd184');polygon([[176,-83],[226,-54],[226,-41],[176,-70]],'#ce795e');
// upper fascia and school signage
rect(-224,-65,399,11,'#344a60');rect(-218,-60,385,3,'#9cc7c1');ctx.fillStyle='#f9edcf';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('SMA NUSANTARA',-24,-47);
// window grid, mullions and reflected glass
for(let r=0;r<2;r++)for(let col=0;col<6;col++){let x=-207+col*63,y=-37+r*48;const g=ctx.createLinearGradient(x,y,x+48,y+35);g.addColorStop(0,'#a9e3df');g.addColorStop(.5,'#78c4cf');g.addColorStop(1,'#548ca5');ctx.fillStyle='#263b52';ctx.beginPath();ctx.roundRect(x-3,y-3,49,38,3);ctx.fill();ctx.fillStyle=g;ctx.fillRect(x,y,43,32);ctx.fillStyle='#e4fff2a8';ctx.beginPath();ctx.moveTo(x+4,y+3);ctx.lineTo(x+18,y+3);ctx.lineTo(x+4,y+19);ctx.closePath();ctx.fill();ctx.fillStyle='#d3e8d8';ctx.fillRect(x+20,y,2,32);ctx.fillRect(x,y+24,43,2)}
// entrance, glass doors and steps
polygon([[-61,88],[-51,38],[55,38],[66,88]],'#33485c');ctx.fillStyle='#94d9d2';ctx.beginPath();ctx.roundRect(-45,39,90,49,4);ctx.fill();rect(-2,40,4,48,'#45697b');rect(-38,44,31,38,'#b8e4d8');rect(7,44,31,38,'#79b9c1');ellipse(27,65,2.5,2.5,'#ffdc80');
polygon([[-68,91],[69,91],[82,103],[-81,103]],'#ded7bd');polygon([[-81,103],[82,103],[91,112],[-90,112]],'#aebcb1');
// planters and flower pops
for(const x of [-202,153]){ctx.fillStyle='#ae8062';ctx.beginPath();ctx.roundRect(x,68,31,17,3);ctx.fill();ellipse(x+15,66,21,10,'#438b72');ellipse(x+7,59,9,10,'#5aa77d');ellipse(x+22,57,9,11,'#72b77f');ellipse(x+14,55,3,3,'#f1bd76')}
ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);
// warm morning sky and soft sun glow
const sky=ctx.createLinearGradient(0,0,0,H*.58);sky.addColorStop(0,'#83c4d2');sky.addColorStop(.62,'#c6e5d8');sky.addColorStop(1,'#f2e7c7');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
const glow=ctx.createRadialGradient(W*.79,H*.18,5,W*.79,H*.18,130);glow.addColorStop(0,'#fff5c8bb');glow.addColorStop(1,'#fff5c800');ctx.fillStyle=glow;ctx.fillRect(W*.60,0,W*.4,H*.42);ellipse(W*.79,H*.18,27,27,'#fff1b8');drawCloud(W*.2,H*.15,.78);drawCloud(W*.54,H*.22,.55);
// distant campus skyline and layered tree line
polygon([[0,H*.4],[W*.08,H*.34],[W*.17,H*.4],[W*.27,H*.31],[W*.38,H*.4],[W*.52,H*.34],[W*.64,H*.4],[W*.78,H*.32],[W*.9,H*.39],[W,H*.33],[W,H*.53],[0,H*.53]],'#8ebcb0');
for(let i=0;i<8;i++){let x=i*W/7;rect(x,H*.36+(i%3)*8,Math.max(28,W*.045),H*.16,'#a9c9b2');rect(x+5,H*.39+(i%3)*8,Math.max(12,W*.018),H*.025,'#d7e9d4')}
// courtyard grass and broad perspective walkway
const lawn=ctx.createLinearGradient(0,H*.42,0,H);lawn.addColorStop(0,'#8fbd91');lawn.addColorStop(.48,'#85b784');lawn.addColorStop(1,'#6ca982');ctx.fillStyle=lawn;ctx.fillRect(0,H*.42,W,H*.58);
polygon([[W*.44,H*.47],[W*.56,H*.47],[W*.94,H],[W*.06,H]],'#d6d2b7');polygon([[W*.46,H*.48],[W*.54,H*.48],[W*.79,H],[W*.21,H]],'#e5dfc7');
// seams recede toward school entrance and foreground paving accents
for(let i=1;i<=7;i++){let t=i/8,y=H*(.49+t*.48),half=W*(.06+t*.38);ctx.strokeStyle='#b9b69f66';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W/2-half,y);ctx.lineTo(W/2+half,y);ctx.stroke()}
for(let i=0;i<8;i++){let x=W*(.13+i*.11);ctx.strokeStyle='#c3bea766';ctx.beginPath();ctx.moveTo(W/2+(x-W/2)*.13,H*.49);ctx.lineTo(x,H);ctx.stroke()}
// planting beds, shrubs and lampposts
for(const side of [-1,1]){let x=W/2+side*Math.min(W*.43,380);polygon([[x-36,H*.51],[x+36,H*.51],[x+59,H*.54],[x-17,H*.54]],'#b78369');ellipse(x,H*.51,42,13,'#4e9a79');ellipse(x-15,H*.49,20,13,'#65ae83');ellipse(x+15,H*.49,21,14,'#78bd88');const lx=W/2+side*Math.min(W*.35,300);rect(lx-2,H*.43,4,H*.13,'#526a70');ellipse(lx,H*.43,8,4,'#ffefb0')}
// tree silhouettes framing the courtyard
for(const x of [W*.04,W*.12,W*.88,W*.97])drawTree(x,H*.49,x<W*.15||x>W*.85?.9:.72);
building();
// render people in depth order
const actors=[['nara',NPC.nara,NPC.nara.c],['raka',NPC.raka,NPC.raka.c],['guru',NPC.guru,NPC.guru.c],['teman',NPC.teman,NPC.teman.c],['player',player,'#ffe66d']].sort((a,b)=>a[1].y-b[1].y);for(const [id,a,c] of actors)character(a.x,a.y,c,id==='player'?player.dir:'down',id==='player');drawHint();
// subtle vignette for a composed scene
const vignette=ctx.createRadialGradient(W/2,H*.48,H*.22,W/2,H*.48,Math.max(W,H)*.8);vignette.addColorStop(.55,'#17243b00');vignette.addColorStop(1,'#17243b24');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H)}
function drawHint(){if(!dialog){let near=findNearby();if(near){ctx.fillStyle='#ffe66d';ctx.strokeStyle='#182137';ctx.lineWidth=3;let p=iso(NPC[near].x,NPC[near].y);ctx.fillRect(p.x-38,p.y-68,76,24);ctx.strokeRect(p.x-38,p.y-68,76,24);ctx.fillStyle='#182137';ctx.font="18px VT323";ctx.textAlign='center';ctx.fillText('AKSI E',p.x,p.y-50)}}}
function findNearby(){for(const n in NPC){if(Math.hypot(player.x-NPC[n].x,player.y-NPC[n].y)<55)return n}return null}
function move(){if(dialog||!started)return;let dx=0,dy=0;if(keys['w']||keys['arrowup']||keys.up)dy=-2;if(keys['s']||keys['arrowdown']||keys.down)dy=2;if(keys['a']||keys['arrowleft']||keys.left)dx=-2;if(keys['d']||keys['arrowright']||keys.right)dx=2;if(dx||dy){player.step++;player.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');player.x=Math.max(-220,Math.min(220,player.x+dx));player.y=Math.max(-150,Math.min(135,player.y+dy))}}
function startDialogue(lines,onEnd){dialog={lines,onEnd};dialogIndex=0;document.getElementById('dialogue').classList.add('show');document.getElementById('choice').style.display='none';renderDialogue()}
function renderDialogue(){const d=dialog.lines[dialogIndex];document.getElementById('portrait').className='portrait '+(d.s||'');document.getElementById('speaker').textContent=d.name||'RAKA';document.getElementById('text').textContent=d.text;if(d.choice){let ch=document.getElementById('choice');ch.style.display='flex';ch.innerHTML='<button>'+d.choice[0]+'</button><button>'+d.choice[1]+'</button>';[...ch.children].forEach((b,i)=>b.onclick=e=>{e.stopPropagation();ch.style.display='none';dialogIndex=Math.min(dialogIndex+1,dialog.lines.length-1);dialog.lines.splice(dialogIndex,0,{name:d.name,s:d.s,text:i?'“Oke… ayo ke kantin dulu.”':'“Ini mungkin kode tentang rencana besok.”'});renderDialogue()})}else document.getElementById('next').style.display='block'}
function advance(){if(!dialog)return;const d=dialog.lines[dialogIndex];if(d.choice)return;if(dialogIndex<dialog.lines.length-1){dialogIndex++;renderDialogue()}else{let end=dialog.onEnd;dialog=null;document.getElementById('dialogue').classList.remove('show');if(end)end()}}
document.getElementById('dialogue').onclick=advance;
function interact(){if(!started||dialog)return;let n=findNearby();if(!n){showToast('Tidak ada yang dekat…');return}if(n==='nara'){if(phase===0){startDialogue([{name:'NARA',s:'nara',text:'Eh, Raka… kamu juga datang pagi?'},{name:'RAKA',s:'raka',text:'Iya. Biasanya aku cuma duduk dan menunggu bel.'},{name:'NARA',s:'nara',text:'Aku menemukan kode aneh di papan kelas: 20 25 1 19 2 12 1 20 8…'},{name:'RAKA',s:'raka',text:'Sepertinya itu kode angka ke huruf. Hasilnya “TUASBLATH”… belum lengkap.'},{name:'NARA',s:'nara',text:'Coba pikirkan lagi. Aku tunggu kamu di laboratorium komputer!' }],()=>{phase=1;codes++;hearts=4;updateHud();showToast('Kode pertama: tabungan rahasia');document.getElementById('questText').textContent='Dekripsi kode bersama Nara di lab';NPC.nara.x=-80;NPC.nara.y=35})}else if(phase===1)labScene();else if(phase===2)ending()}if(n==='teman'&&phase===0)startDialogue([{name:'AZA',text:'Kamu jarang datang pagi, Raka. Ada rahasia?'},{name:'RAKA',text:'Mungkin hari ini akan sedikit beda.'}]);if(n==='guru')startDialogue([{name:'BU ARINI',text:'Tugas coding dikumpulkan hari Jumat. Jangan menunggu bel terakhir ya.'},{name:'RAKA',text:'Siap, Bu.'}]);if(n==='raka')startDialogue([{name:'DIRI SENDIRI',text:'Aneh… ada pesan baru di loker. Siapa yang menaruhnya?' }])}
function labScene(){startDialogue([{name:'NARA',s:'nara',text:'Coba masukkan angka itu sebagai posisi alfabet.'},{name:'RAKA',s:'raka',text:'20=T, 25=Y, 1=A, 19=S, 2=B, 12=L, 1=A, 20=T, 8=H. Jadi: TYASBLATH?'},{name:'NARA',s:'nara',text:'Tunggu… geser urutannya. T-Y-A-S menjadi S-A-Y-A. S-A-B-L-A-T-H?'},{name:'RAKA',s:'raka',text:'Aku mengerti! “SAYA B LATH…”'}, {name:'NARA',s:'nara',text:'Maksudku “SAYA SUKA LATIH”? Biar aku coba sendiri.'},{name:'RAKA',s:'raka',text:'Atau: “SUKA KAMU” kalau angka itu dibaca terbalik.'},{name:'NARA',s:'nara',text:'Jadi… kita sama-sama tahu maksudnya?'},{name:'RAKA',s:'raka',text:'Ya. Dan aku ingin bilang: aku suka cara kamu tersenyum.'},{name:'NARA',s:'nara',choice:['Aku juga suka kamu','Aku masih malu'] }],()=>{phase=2;hearts=5;updateHud();showToast('Kode terakhir terbuka!');document.getElementById('questText').textContent='Temui Nara di depan sekolah';NPC.nara.x=95;NPC.nara.y=5})}
function ending(){startDialogue([{name:'NARA',s:'nara',text:'Kamu datang juga ke rooftop.'},{name:'RAKA',s:'raka',text:'Katanya ini tempat paling dekat dengan langit. Aku ingin memastikan satu hal.'},{name:'NARA',s:'nara',text:'Satu hal apa?'},{name:'RAKA',s:'raka',text:'Bolehkan kita menjalani hari-hari sekolah ini… bersama?'},{name:'NARA',s:'nara',text:'Dengan satu syarat: jangan pakai kode lagi. Kecuali kode jadian kita.'},{name:'RAKA',s:'raka',text:'01001010 01000001 01000100 01001001 01000001 01001110.'},{name:'NARA',s:'nara',text:'Kamu pelajar yang mudah sekali ditebak… dan aku suka itu.'},{name:'RAKA',s:'raka',text:'JADIAN!'},{name:'NARA',s:'nara',text:'Iya, Raka. Kita pacaran sekarang.'}],()=>{phase=3;updateHud();showEnding()})}
function updateHud(){document.getElementById('hearts').textContent='♥'.repeat(hearts);document.getElementById('time').textContent=phase>=2?'08:15':'07:45'}
function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function showEnding(){dialog={lines:[{name:'THE END',text:'PIXELUM — Kode Pertama\n\nMereka berdua memilih untuk tidak lagi menyembunyikan perasaan.\n\nHappy ending ♥'}],onEnd:null};dialogIndex=0;document.getElementById('dialogue').classList.add('show');document.querySelector('.portrait').style.display='none';renderEnding();}
function renderEnding(){let d=dialog.lines[dialogIndex];document.getElementById('speaker').textContent=d.name;document.getElementById('text').textContent=d.text;document.getElementById('choice').style.display='none';document.getElementById('next').style.display='block'}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e'||e.key===' ')interact();if(e.key==='Enter'&&dialog)advance()});document.getElementById('interact').onclick=interact;
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.setPointerCapture&&b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});b.addEventListener('pointerup',e=>{e.preventDefault();keys[k]=false});b.addEventListener('pointercancel',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)});
keys.up=false;keys.down=false;keys.left=false;keys.right=false;
function loop(){move();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
