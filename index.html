<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Pixelum — Kode Pertama</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--ink:#182137;--cream:#fff6dc;--pink:#ff78a7;--cyan:#55d8cc;--yellow:#ffe66d}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#111827;color:var(--cream);font-family:'VT323',monospace}canvas{display:block;image-rendering:pixelated}#ui{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;left:16px;right:16px;top:12px;height:66px;display:flex;justify-content:space-between;align-items:flex-start}.brand{background:#182137d9;border:4px solid #fff6dc;padding:9px 12px 7px;box-shadow:6px 6px 0 #10152a}.brand b{display:block;font:12px 'Press Start 2P';letter-spacing:-1px}.brand span{color:#55d8cc;font-size:20px}.hud{display:flex;gap:8px}.chip{background:#182137d9;border:3px solid #fff6dc;padding:8px 10px;font-size:20px;box-shadow:4px 4px 0 #10152a}.chip em{color:#ffe66d;font-style:normal}.hearts{color:#ff78a7;letter-spacing:2px}.quest{position:absolute;left:16px;bottom:18px;width:min(390px,calc(100vw - 32px));background:#182137e8;border:4px solid #fff6dc;box-shadow:7px 7px 0 #10152a;padding:12px 14px 10px}.quest h3{margin:0 0 5px;font:9px 'Press Start 2P';color:#ffe66d}.quest p{margin:0;font-size:21px;line-height:1}.dialogue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(680px,calc(100vw - 32px));min-height:132px;background:#182137f2;border:5px solid #fff6dc;box-shadow:8px 8px 0 #10152a,14px 14px 0 #10152a55;padding:16px 20px 20px;pointer-events:auto;display:none}.dialogue.show{display:block}.portrait{position:absolute;left:-20px;top:-38px;width:68px;height:68px;border:4px solid #fff6dc;background:#55d8cc;box-shadow:4px 4px 0 #10152a;image-rendering:pixelated}.portrait:before{content:'';position:absolute;width:30px;height:34px;left:15px;top:16px;background:#ffd3a3;box-shadow:0 -8px 0 #2a2038, -7px 10px 0 #2a2038,7px 10px 0 #2a2038}.portrait.raka:before{background:#9f6b50;box-shadow:0 -8px 0 #17213d,-7px 10px 0 #17213d,7px 10px 0 #17213d}.portrait.nara:before{background:#ffd3a3;box-shadow:0 -8px 0 #4b2b50,-7px 12px 0 #4b2b50,7px 12px 0 #4b2b50}.speaker{font:9px 'Press Start 2P';color:#55d8cc;margin:0 0 9px 48px}.text{font-size:24px;line-height:1.05;min-height:48px}.next{position:absolute;right:14px;bottom:8px;font-size:18px;color:#ffe66d;animation:bob .7s steps(2) infinite}@keyframes bob{50%{transform:translateY(3px)}}.menu{position:absolute;inset:0;background:linear-gradient(135deg,#182137ee,#18213799);display:flex;align-items:center;justify-content:center;pointer-events:auto}.menu.hidden{display:none}.card{text-align:center;background:#182137;border:6px solid #fff6dc;box-shadow:10px 10px 0 #10152a;padding:32px 44px;width:min(520px,calc(100vw - 38px))}.kicker{color:#55d8cc;font:10px 'Press Start 2P'}.card h1{font:22px 'Press Start 2P';line-height:1.45;margin:18px 0 10px}.card h1 span{color:#ff78a7}.card p{font-size:24px;margin:10px 0 22px}.card button{font:10px 'Press Start 2P';color:#182137;background:#ffe66d;border:0;border-bottom:7px solid #d4a84e;padding:15px 18px 11px;cursor:pointer}.card button:hover{filter:brightness(1.08);transform:translateY(-2px)}.controls{position:absolute;right:16px;bottom:16px;display:none;pointer-events:auto;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:3px}.controls button{border:3px solid #fff6dc;background:#182137b8;color:#fff;font-size:22px;border-radius:4px}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.interact{position:absolute;right:18px;bottom:190px;border:3px solid #fff6dc;background:#ff78a7;color:#fff;border-radius:50%;width:64px;height:64px;font:10px 'Press Start 2P';pointer-events:auto;display:none}.toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:#ffe66d;color:#182137;border:4px solid #fff6dc;padding:8px 12px;font-size:21px;opacity:0;transition:.25s}.toast.show{opacity:1}.choice{display:flex;gap:8px;margin-top:12px}.choice button{flex:1;border:3px solid #fff6dc;background:#55d8cc;color:#182137;font:8px 'Press Start 2P';padding:10px 5px}.choice button:last-child{background:#ff78a7}@media(max-width:700px),(pointer:coarse){.controls,.interact{display:grid}.interact{display:block}.quest{bottom:190px}.topbar{left:8px;right:8px}.brand{transform:scale(.85);transform-origin:left top}.chip{font-size:16px;padding:6px}.hud{gap:4px}.dialogue{bottom:16px}.quest p{font-size:18px}.brand span{font-size:18px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div class="topbar"><div class="brand"><b>PIXELUM</b><span>Chapter 01</span></div><div class="hud"><div class="chip">WAKTU <em id="time">07:30</em></div><div class="chip hearts" id="hearts">♥♥♥</div></div></div><div class="toast" id="toast">Kode baru didapat!</div><div class="quest" id="quest"><h3>MISSION</h3><p id="questText">Temukan Nara di depan kelas</p></div><div class="dialogue" id="dialogue"><div class="portrait" id="portrait"></div><div class="speaker" id="speaker">RAKA</div><div class="text" id="text"></div><div class="choice" id="choice" style="display:none"></div><div class="next" id="next">▼</div></div><div class="controls"><button class="up" data-key="up">▲</button><button class="left" data-key="left">◀</button><button class="down" data-key="down">▼</button><button class="right" data-key="right">▶</button></div><button class="interact" id="interact">AKSI</button><div class="menu" id="menu"><div class="card"><div class="kicker">A SCHOOL PIXEL STORY</div><h1>PIXELUM<br><span>KODE PERTAMA</span></h1><p>SMA Nusantara • 07:30<br>Satu hari biasa yang mungkin jadi tak biasa.</p><button id="start">MULAI SEKOLAH</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLower]}),addEventListener('keyup',e=>keys[e.key.toLower]=false);
let started=false,dialog=null,dialogIndex=0,phase=0,hearts=3,codes=0;
const player={x:0,y:0,dir:'down',step:0};
const NPC={nara:{x:0,y:-42,c:'#4b2b50'},raka:{x:-150,y:-10,c:'#17213d'},guru:{x:145,y:-100,c:'#465a75'},teman:{x:105,y:70,c:'#d48857'}};
let world={ox:0,oy:0};
const menu=document.getElementById('menu');document.getElementById('start').onclick=()=>{menu.classList.add('hidden');started=true;showToast('Hari baru, sama seperti kemarin…')};
function iso(x,y){return {x:W/2+world.ox+x-world.ox,y:H/2+world.oy+(y+world.oy)*.58}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function drawTile(cx,cy,size,color){ctx.beginPath();ctx.moveTo(cx,cy-size*.5);ctx.lineTo(cx+size,cy);ctx.lineTo(cx,cy+size*.5);ctx.lineTo(cx-size,cy);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#2c3854';ctx.lineWidth=1;ctx.stroke()}
function shadow(x,y){ctx.fillStyle='#11182755';ctx.beginPath();ctx.ellipse(x,y+10,17,7,0,0,Math.PI*2);ctx.fill()}
function character(x,y,c,dir='down',isPlayer=false){const p=iso(x,y);shadow(p.x,p.y);ctx.fillStyle=c;ctx.fillRect(p.x-12,p.y-30,24,22);ctx.fillStyle=isPlayer?'#ffd3a3':'#ffc9a6';ctx.fillRect(p.x-9,p.y-43,18,15);ctx.fillStyle='#20283a';ctx.fillRect(p.x-10,p.y-48,20,7);ctx.fillStyle='#182137';ctx.fillRect(p.x-7,p.y-32,6,8);ctx.fillRect(p.x+1,p.y-32,6,8);if(dir==='left')ctx.fillRect(p.x-12,p.y-25,5,14);if(dir==='right')ctx.fillRect(p.x+7,p.y-25,5,14)}
function building(){const cx=W/2,cy=H/2-35;ctx.fillStyle='#26334d';ctx.fillRect(cx-250,cy-160,500,210);ctx.fillStyle='#465a75';ctx.fillRect(cx-240,cy-150,480,190);ctx.fillStyle='#ffe66d';for(let r=0;r<3;r++){for(let c=0;c<6;c++){ctx.fillRect(cx-210+c*78,cy-120+r*48,42,28);ctx.fillStyle='#55d8cc';ctx.fillRect(cx-208+c*78,cy-118+r*48,38,24);ctx.fillStyle='#ffe66d'}}ctx.fillStyle='#182137';ctx.fillRect(cx-42,cy-25,84,75);ctx.fillStyle='#55d8cc';ctx.fillRect(cx-34,cy-17,68,67);ctx.fillStyle='#182137';ctx.fillRect(cx-250,cy-170,500,12);ctx.fillStyle='#ff78a7';ctx.fillRect(cx-250,cy-182,500,12)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#86aeb0';ctx.fillRect(0,0,W,H);ctx.fillStyle='#a8c7b5';ctx.fillRect(0,H*.58,W,H*.42);for(let y=-250;y<300;y+=34){for(let x=-450;x<451;x+=34){let q=(Math.floor((x+450)/34)+Math.floor((y+250)/34))%2;drawTile(W/2+x,H/2+y*.58+30,34,q?'#d8cfaa':'#c5bf9d')}}building();character(NPC.nara.x,NPC.nara.y,NPC.nara.c,'down');character(NPC.raka.x,NPC.raka.y,NPC.raka.c,'down');character(NPC.guru.x,NPC.guru.y,NPC.guru.c,'down');character(NPC.teman.x,NPC.teman.y,NPC.teman.c,'down');character(player.x,player.y,'#ffe66d',player.dir,true);drawHint();}
function drawHint(){if(!dialog){let near=findNearby();if(near){ctx.fillStyle='#ffe66d';ctx.strokeStyle='#182137';ctx.lineWidth=3;let p=iso(NPC[near].x,NPC[near].y);ctx.fillRect(p.x-38,p.y-68,76,24);ctx.strokeRect(p.x-38,p.y-68,76,24);ctx.fillStyle='#182137';ctx.font="18px VT323";ctx.textAlign='center';ctx.fillText('AKSI E',p.x,p.y-50)}}}
function findNearby(){for(const n in NPC){if(Math.hypot(player.x-NPC[n].x,player.y-NPC[n].y)<55)return n}return null}
function move(){if(dialog||!started)return;let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy=-2;if(keys['s']||keys['arrowdown'])dy=2;if(keys['a']||keys['arrowleft'])dx=-2;if(keys['d']||keys['arrowright'])dx=2;if(dx||dy){player.step++;player.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');player.x=Math.max(-220,Math.min(220,player.x+dx));player.y=Math.max(-150,Math.min(135,player.y+dy))}}
function startDialogue(lines,onEnd){dialog={lines,onEnd};dialogIndex=0;document.getElementById('dialogue').classList.add('show');document.getElementById('choice').style.display='none';renderDialogue()}
function renderDialogue(){const d=dialog.lines[dialogIndex];document.getElementById('portrait').className='portrait '+(d.s||'');document.getElementById('speaker').textContent=d.name||'RAKA';document.getElementById('text').textContent=d.text;if(d.choice){let ch=document.getElementById('choice');ch.style.display='flex';ch.innerHTML='<button>'+d.choice[0]+'</button><button>'+d.choice[1]+'</button>';[...ch.children].forEach((b,i)=>b.onclick=e=>{e.stopPropagation();ch.style.display='none';dialogIndex=Math.min(dialogIndex+1,dialog.lines.length-1);dialog.lines.splice(dialogIndex,0,{name:d.name,s:d.s,text:i?'“Oke… ayo ke kantin dulu.”':'“Ini mungkin kode tentang rencana besok.”'});renderDialogue()})}else document.getElementById('next').style.display='block'}
function advance(){if(!dialog)return;const d=dialog.lines[dialogIndex];if(d.choice)return;if(dialogIndex<dialog.lines.length-1){dialogIndex++;renderDialogue()}else{let end=dialog.onEnd;dialog=null;document.getElementById('dialogue').classList.remove('show');if(end)end()}}
document.getElementById('dialogue').onclick=advance;
function interact(){if(!started||dialog)return;let n=findNearby();if(!n){showToast('Tidak ada yang dekat…');return}if(n==='nara'){if(phase===0){startDialogue([{name:'NARA',s:'nara',text:'Eh, Raka… kamu juga datang pagi?'},{name:'RAKA',s:'raka',text:'Iya. Biasanya aku cuma duduk dan menunggu bel.'},{name:'NARA',s:'nara',text:'Aku menemukan kode aneh di papan kelas: 20 25 1 19 2 12 1 20 8…'},{name:'RAKA',s:'raka',text:'Sepertinya itu kode angka ke huruf. Hasilnya “TUASBLATH”… belum lengkap.'},{name:'NARA',s:'nara',text:'Coba pikirkan lagi. Aku tunggu kamu di laboratorium komputer!' }],()=>{phase=1;codes++;hearts=4;updateHud();showToast('Kode pertama: tabungan rahasia');document.getElementById('questText').textContent='Dekripsi kode bersama Nara di lab';NPC.nara.x=-80})}else if(phase===1)labScene();else if(phase===2)ending()}if(n==='teman'&&phase===0)startDialogue([{name:'AZA',text:'Kamu jarang datang pagi, Raka. Ada rahasia?'},{name:'RAKA',text:'Mungkin hari ini akan sedikit beda.'}]);if(n==='guru')startDialogue([{name:'BU ARINI',text:'Tugas coding dikumpulkan hari Jumat. Jangan menunggu bel terakhir ya.'},{name:'RAKA',text:'Siap, Bu.'}]);if(n==='raka')startDialogue([{name:'DIRI SENDIRI',text:'Aneh… ada pesan baru di loker. Siapa yang menaruhnya?' }])}
function labScene(){startDialogue([{name:'NARA',s:'nara',text:'Coba masukkan angka itu sebagai posisi alfabet.'},{name:'RAKA',s:'raka',text:'20=T, 25=Y, 1=A, 19=S, 2=B, 12=L, 1=A, 20=T, 8=H. Jadi: TYASBLATH?'},{name:'NARA',s:'nara',text:'Tunggu… geser urutannya. T-Y-A-S menjadi S-A-Y-A. S-A-B-L-A-T-H?'},{name:'RAKA',s:'raka',text:'Aku mengerti! “SAYA B LATH…”'}, {name:'NARA',s:'nara',text:'Maksudku “SAYA SUKA LATIH”? Biar aku coba sendiri.'},{name:'RAKA',s:'raka',text:'Atau: “SUKA KAMU” kalau angka itu dibaca terbalik.'},{name:'NARA',s:'nara',text:'Jadi… kita sama-sama tahu maksudnya?'},{name:'RAKA',s:'raka',text:'Ya. Dan aku ingin bilang: aku suka cara kamu tersenyum.'},{name:'NARA',s:'nara',choice:['Aku juga suka kamu','Aku masih malu'] }],()=>{phase=2;hearts=5;updateHud();showToast('Kode terakhir terbuka!');document.getElementById('questText').textContent='Temui Nara di rooftop';NPC.nara.x=170;NPC.nara.y=-120})}
function ending(){startDialogue([{name:'NARA',s:'nara',text:'Kamu datang juga ke rooftop.'},{name:'RAKA',s:'raka',text:'Katanya ini tempat paling dekat dengan langit. Aku ingin memastikan satu hal.'},{name:'NARA',s:'nara',text:'Satu hal apa?'},{name:'RAKA',s:'raka',text:'Bolehkan kita menjalani hari-hari sekolah ini… bersama?'},{name:'NARA',s:'nara',text:'Dengan satu syarat: jangan pakai kode lagi. Kecuali kode jadian kita.'},{name:'RAKA',s:'raka',text:'01001010 01000001 01000100 01001001 01000001 01001110.'},{name:'NARA',s:'nara',text:'Kamu pelajar yang mudah sekali ditebak… dan aku suka itu.'},{name:'RAKA',s:'raka',text:'JADIAN!'},{name:'NARA',s:'nara',text:'Iya, Raka. Kita pacaran sekarang.'}],()=>{phase=3;updateHud();showEnding()})}
function updateHud(){document.getElementById('hearts').textContent='♥'.repeat(hearts);document.getElementById('time').textContent=phase>=2?'08:15':'07:45'}
function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function showEnding(){dialog={lines:[{name:'THE END',text:'PIXELUM — Kode Pertama\n\nMereka berdua memilih untuk tidak lagi menyembunyikan perasaan.\n\nHappy ending ♥'}],onEnd:null};dialogIndex=0;document.getElementById('dialogue').classList.add('show');document.querySelector('.portrait').style.display='none';renderEnding();}
function renderEnding(){let d=dialog.lines[dialogIndex];document.getElementById('speaker').textContent=d.name;document.getElementById('text').textContent=d.text;document.getElementById('choice').style.display='none';document.getElementById('next').style.display='block'}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e'||e.key===' ')interact();if(e.key==='Enter'&&dialog)advance()});document.getElementById('interact').onclick=interact;
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]='true'});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)});
keys.up=false;keys.down=false;keys.left=false;keys.right=false;
function loop(){move();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
